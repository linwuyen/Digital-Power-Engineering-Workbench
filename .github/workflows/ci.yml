name: Workbench CI

on:
  push:
    branches:
      - main
      - feat/workbench-mvp
      - feat/workbench-v1-engineering
      - feat/engineering-data-source
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python regression
        run: python -m unittest discover -s tests -v

      - name: Python syntax
        run: python -m py_compile server.py workbench/*.py tests/test_engineering_data.py

      - name: Engineering data JSON integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('engineering_data').rglob('*.json'))
          assert files, 'no engineering_data JSON files found'
          for path in files:
              with path.open(encoding='utf-8') as f:
                  json.load(f)
          print(f'validated {len(files)} engineering_data JSON files')
          PY

      - name: Browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/i18n.js
          node --check static/eng/loader.js
          node --check static/eng/common.js
          node --check static/eng/profiles.js
          node --check static/eng/control_sfra.js
          node --check static/eng/system_tools.js
