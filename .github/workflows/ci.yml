name: Workbench CI

on:
  push:
    branches:
      - main
      - feat/workbench-mvp
      - feat/workbench-v1-engineering
      - feat/engineering-data-source
      - feat/final-workbench-integration
      - feat/engineering-memory-ssot
      - feat/engineering-os-automation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python regression
        run: python -m unittest discover -s tests -v

      - name: Python syntax
        run: python -m py_compile server.py workbench/*.py tools/*.py tests/*.py

      - name: Engineering data JSON integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('engineering_data').rglob('*.json'))
          assert files, 'no engineering_data JSON files found'
          for path in files:
              with path.open(encoding='utf-8') as f:
                  json.load(f)
          jsonl = sorted(Path('engineering_data').rglob('*.jsonl'))
          for path in jsonl:
              with path.open(encoding='utf-8') as f:
                  for line_no, line in enumerate(f, 1):
                      if line.strip():
                          json.loads(line)
          print(f'validated {len(files)} JSON and {len(jsonl)} JSONL files')
          PY

      - name: Traceability resolves without orphan evidence
        run: python tools/traceability.py --out /tmp/traceability.json

      - name: HIL runner mock is explicitly non-qualifying
        run: |
          python tools/hil_runner.py --plan engineering_data/hil/reference_mock_plan.json --mode mock --out /tmp/hil-mock.json
          python - <<'PY'
          import json
          with open('/tmp/hil-mock.json', encoding='utf-8') as f:
              run = json.load(f)
          assert run['result'] == 'SIMULATION_PASS'
          assert run['qualification_claimed'] is False
          PY

      - name: Clone pinned ASR5K production baseline read-only
        run: |
          git clone --depth 1 --branch feat/voltage-slew-runtime-complete https://github.com/linwuyen/ASR5K_v2_28384.git /tmp/asr5k
          test "$(git -C /tmp/asr5k rev-parse HEAD)" = "2b72f50648d86c11547645882248eed69f12892f"

      - name: Extract production source truth and reject drift
        run: |
          python tools/extract_source_truth.py \
            --source-root /tmp/asr5k \
            --baseline 2b72f50648d86c11547645882248eed69f12892f \
            --out /tmp/asr5k-source-truth.json
          python tools/verify_truth_drift.py \
            --snapshot /tmp/asr5k-source-truth.json \
            --data-root engineering_data \
            --report /tmp/truth-drift.json

      - name: Browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/i18n.js
          node --check static/eng/loader.js
          node --check static/eng/common.js
          node --check static/eng/data_source.js
          node --check static/eng/profiles.js
          node --check static/eng/control_sfra.js
          node --check static/eng/system_tools.js
