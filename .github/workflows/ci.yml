name: Workbench CI

on:
  push:
    branches:
      - main
      - feat/workbench-mvp
      - feat/workbench-v1-engineering
      - feat/engineering-data-source
      - feat/final-workbench-integration
      - feat/engineering-memory-ssot
      - feat/engineering-os-automation
      - feat/full-auto-evidence-pipeline
      - feat/auto-bind-real-hardware
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python regression
        run: python -m unittest discover -s tests -v

      - name: Python syntax
        run: python -m py_compile server.py workbench/*.py tools/*.py tests/*.py

      - name: Engineering data JSON integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('engineering_data').rglob('*.json'))
          assert files, 'no engineering_data JSON files found'
          for path in files:
              with path.open(encoding='utf-8') as f:
                  json.load(f)
          jsonl = sorted(Path('engineering_data').rglob('*.jsonl'))
          for path in jsonl:
              with path.open(encoding='utf-8') as f:
                  for line_no, line in enumerate(f, 1):
                      if line.strip():
                          json.loads(line)
          print(f'validated {len(files)} JSON and {len(jsonl)} JSONL files')
          PY

      - name: Traceability resolves without orphan evidence
        run: python tools/traceability.py --out /tmp/traceability.json

      - name: HIL runner mock is explicitly non-qualifying
        run: |
          python tools/hil_runner.py --plan engineering_data/hil/reference_mock_plan.json --mode mock --out /tmp/hil-mock.json
          python - <<'PY'
          import json
          with open('/tmp/hil-mock.json', encoding='utf-8') as f:
              run = json.load(f)
          assert run['result'] == 'SIMULATION_PASS'
          assert run['qualification_claimed'] is False
          PY

      - name: Full-auto end-to-end smoke remains non-qualifying in simulation
        run: |
          python tools/auto_run_ext.py --config config/auto_run.ci.json run AUTO-REFERENCE-MOCK-001 > /tmp/auto-run.txt
          cat /tmp/auto-run.txt
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('.engineering_local/ci-runtime/latest_run.json').read_text())
          assert latest['result'] == 'COMPLETED_UNQUALIFIED'
          assert latest['qualification_claimed'] is False
          assert latest['evidence_ids']
          archive = Path(latest['archive_path'])
          assert (archive / 'manifest.json').exists()
          assert (archive / 'summary.json').exists()
          PY

      - name: Build plans are non-physical and exact-baseline bound
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import auto_run_ext
          baseline = '2b72f50648d86c11547645882248eed69f12892f'
          for name in ['cpu1_build.json','cpu2_build.json','m0_build.json','triple_build.json']:
              plan = json.loads((Path('engineering_data/automation/plans') / name).read_text())
              assert plan['mode'] == 'build'
              assert plan['baseline'] == baseline
              auto_run_ext.validate_plan(plan)
          print('validated exact-baseline build plans')
          PY

      - name: Reject drift from pinned exact-source snapshot
        run: |
          python tools/verify_truth_drift.py \
            --snapshot engineering_data/source_truth/snapshot-2b72f506.json \
            --data-root engineering_data \
            --report /tmp/truth-drift-pinned.json

      - name: Optional live private ASR5K source recheck
        env:
          ASR5K_READ_TOKEN: ${{ secrets.ASR5K_READ_TOKEN }}
        run: |
          if [ -z "$ASR5K_READ_TOKEN" ]; then
            echo "::notice::Live ASR5K source drift check SKIPPED: ASR5K_READ_TOKEN is not configured. Pinned exact-source snapshot check already passed."
            exit 0
          fi
          rm -rf /tmp/asr5k
          git clone --quiet --depth 1 --branch feat/voltage-slew-runtime-complete \
            "https://x-access-token:${ASR5K_READ_TOKEN}@github.com/linwuyen/ASR5K_v2_28384.git" /tmp/asr5k
          test "$(git -C /tmp/asr5k rev-parse HEAD)" = "2b72f50648d86c11547645882248eed69f12892f"
          python tools/extract_source_truth.py \
            --source-root /tmp/asr5k \
            --baseline 2b72f50648d86c11547645882248eed69f12892f \
            --out /tmp/asr5k-live-source-truth.json
          python tools/verify_truth_drift.py \
            --snapshot /tmp/asr5k-live-source-truth.json \
            --data-root engineering_data \
            --report /tmp/truth-drift-live.json

      - name: Browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/i18n.js
          node --check static/eng/loader.js
          node --check static/eng/common.js
          node --check static/eng/data_source.js
          node --check static/eng/profiles.js
          node --check static/eng/control_sfra.js
          node --check static/eng/system_tools.js
